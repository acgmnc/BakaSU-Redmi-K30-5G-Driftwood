name: Check BakaSU upstream

# 手动触发：对比 BakaSU main 与 upstream.lock 里钉住的 commit。
# 只做提醒，不自动改代码 —— 移植需要本地编译 + 真机验证后才能更新 lock。
#
# 更新流程（本地）：
#   1. 把 Baka-SU/BakaSU 新 commit 的 kernel/ + uapi/ 同步进 kernel/
#   2. 更新 kernel/Kbuild 的 KSU_VERSION / KSU_TAG_NAME / KSU_COMMIT_SHA
#      （KSU_VERSION = 30000 + main 提交数 + 700）
#   3. 更新 upstream.lock 的 commit / commit_count / ksu_version
#   4. build.sh 编译 + 真机刷入验证
#   5. 提交

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compare upstream head with lock
        run: |
          set -euo pipefail
          SHA="$(git ls-remote https://github.com/Baka-SU/BakaSU.git refs/heads/main | cut -f1)"
          LOCK="$(python3 -c "import json;print(json.load(open('upstream.lock'))['commit'])")"
          COUNT="$(python3 -c "import json;print(json.load(open('upstream.lock'))['commit_count'])")"
          VER="$(python3 -c "import json;print(json.load(open('upstream.lock'))['ksu_version'])")"
          echo "upstream main : $SHA"
          echo "upstream.lock : $LOCK (commits=$COUNT, KSU_VERSION=$VER)"
          if [ "$SHA" != "$LOCK" ]; then
            echo "::warning::BakaSU main 有更新：$SHA（当前锁定 $LOCK）"
            {
              echo "### BakaSU upstream 有新提交"
              echo ""
              echo "- 上游 main: \`$SHA\`"
              echo "- 当前锁定:  \`$LOCK\`（$COUNT commits，KSU_VERSION $VER）"
              echo ""
              echo "按 README「说明与已知问题」更新 kernel/、Kbuild、upstream.lock 后重新编译验证。"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "已是最新，无需更新。"
          fi
